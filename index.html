<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backyard Kickoff</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: white;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.hero {
  min-height: 52vh;
  position: relative;
  background:
    linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.18)),
    url("609DF914-C4E1-4512-9C0F-3E452062484D.png");
  background-size: cover;
  background-position: center 58%;
}

.hero-title {
  position: absolute;
  top: 20px;
  left: 0;
  right: 0;
  text-align: center;
  text-shadow: 0 3px 12px #000;
}

.hero-title h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 900;
}

.hero-title p {
  margin: 5px 0 0;
  font-weight: bold;
  font-size: 15px;
}

.goal-message {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 16px;
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  text-shadow: 0 3px 10px black;
  min-height: 36px;
}

.game-panel {
  background: #111820;
  padding: 14px;
  border-radius: 24px 24px 0 0;
  margin-top: -6px;
}

.team {
  background: #1a222c;
  border: 1px solid #33404d;
  border-radius: 18px;
  padding: 11px;
  margin-bottom: 10px;
}

.team-top {
  display: grid;
  grid-template-columns: 1fr 90px 50px;
  gap: 7px;
}

.team-name {
  width: 100%;
  min-width: 0;
  border: 0;
  border-radius: 11px;
  padding: 11px 8px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.flag-select {
  border: 0;
  border-radius: 11px;
  padding: 8px 4px;
  font-size: 16px;
}

.colour-picker {
  width: 50px;
  height: 42px;
  border: 0;
  border-radius: 11px;
  padding: 3px;
}

.team-bottom {
  display: grid;
  grid-template-columns: 65px 1fr 125px;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.flag {
  font-size: 38px;
  text-align: center;
}

.score {
  font-size: 62px;
  line-height: 1;
  text-align: center;
  font-weight: 900;
}

.goal-btn {
  min-height: 66px;
  border: 0;
  border-radius: 16px;
  color: white;
  font-size: 17px;
  font-weight: 900;
}

.goal-btn:active {
  transform: scale(.96);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 7px;
  margin-top: 4px;
}

.control-btn {
  border: 1px solid #445160;
  border-radius: 13px;
  padding: 11px 4px;
  background: #1a222c;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.credit {
  text-align: center;
  font-size: 13px;
  opacity: .75;
  margin-top: 10px;
}

@media (max-width: 390px) {
  .hero {
    min-height: 50vh;
    background-position: center 60%;
  }

  .hero-title h1 {
    font-size: 30px;
  }

  .team-bottom {
    grid-template-columns: 55px 1fr 110px;
  }

  .score {
    font-size: 56px;
  }

  .goal-btn {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <div class="hero-title">
      <h1>⚽ Backyard Kickoff</h1>
      <p>Pick your teams. Start the match!</p>
    </div>

    <div id="goalMessage" class="goal-message"></div>

  </section>

  <section class="game-panel">

    <div class="team">

      <div class="team-top">

        <input id="name1" class="team-name" value="Arlo United">

        <select id="flag1" class="flag-select" onchange="changeFlag(1)">
          <option value="🇦🇺">🇦🇺 AUS</option>
          <option value="🇦🇷">🇦🇷 ARG</option>
          <option value="🇧🇷">🇧🇷 BRA</option>
          <option value="🇫🇷">🇫🇷 FRA</option>
          <option value="🇩🇪">🇩🇪 GER</option>
          <option value="🇮🇹">🇮🇹 ITA</option>
          <option value="🇵🇹">🇵🇹 POR</option>
          <option value="🇪🇸">🇪🇸 ESP</option>
          <option value="🏴">🏴 ENG</option>
          <option value="🇳🇱">🇳🇱 NED</option>
        </select>

        <input
          id="colour1"
          class="colour-picker"
          type="color"
          value="#e11d48"
          onchange="changeColour(1)"
        >

      </div>

      <div class="team-bottom">

        <div id="flagDisplay1" class="flag">🇦🇺</div>
        <div id="score1" class="score">0</div>

        <button id="goal1" class="goal-btn" onclick="goal(1)">
          ⚽ GOAL!
        </button>

      </div>

    </div>

    <div class="team">

      <div class="team-top">

        <input id="name2" class="team-name" value="Dad FC">

        <select id="flag2" class="flag-select" onchange="changeFlag(2)">
          <option value="🇦🇺">🇦🇺 AUS</option>
          <option value="🇦🇷">🇦🇷 ARG</option>
          <option value="🇧🇷">🇧🇷 BRA</option>
          <option value="🇫🇷">🇫🇷 FRA</option>
          <option value="🇩🇪">🇩🇪 GER</option>
          <option value="🇮🇹">🇮🇹 ITA</option>
          <option value="🇵🇹">🇵🇹 POR</option>
          <option value="🇪🇸">🇪🇸 ESP</option>
          <option value="🏴">🏴 ENG</option>
          <option value="🇳🇱">🇳🇱 NED</option>
        </select>

        <input
          id="colour2"
          class="colour-picker"
          type="color"
          value="#2563eb"
          onchange="changeColour(2)"
        >

      </div>

      <div class="team-bottom">

        <div id="flagDisplay2" class="flag">🇦🇺</div>
        <div id="score2" class="score">0</div>

        <button id="goal2" class="goal-btn" onclick="goal(2)">
          ⚽ GOAL!
        </button>

      </div>

    </div>

    <div class="controls">

      <button class="control-btn" onclick="undoGoal()">
        ↩ Undo
      </button>

      <button class="control-btn" onclick="resetGame()">
        🔄 New Game
      </button>

      <button class="control-btn" onclick="toggleSound()">
        🔊 Sound
      </button>

    </div>

    <div class="credit">
      Created by Arlo ⚽
    </div>

  </section>

</div>

<audio
  id="goalSound"
  src="ElevenLabs_Generation_3.ogg"
  preload="auto">
</audio>

<script>

let scores = [0, 0];
let lastTeam = null;
let soundOn = true;

function goal(team) {

  const index = team - 1;

  scores[index]++;

  document.getElementById("score" + team).textContent =
    scores[index];

  lastTeam = team;

  const name =
    document.getElementById("name" + team).value ||
    "Team " + team;

  document.getElementById("goalMessage").textContent =
    "⚽ GOOOOOOAL! " + name + "!";

  if (soundOn) {
    playGoalSound();
  }

  setTimeout(() => {
    document.getElementById("goalMessage").textContent = "";
  }, 2200);
}

function playGoalSound() {

  const sound =
    document.getElementById("goalSound");

  sound.pause();
  sound.currentTime = 0;

  sound.play().catch(() => {});

}

function undoGoal() {

  if (lastTeam && scores[lastTeam - 1] > 0) {

    scores[lastTeam - 1]--;

    document.getElementById(
      "score" + lastTeam
    ).textContent =
      scores[lastTeam - 1];

  }

}

function resetGame() {

  scores = [0, 0];
  lastTeam = null;

  document.getElementById("score1").textContent = "0";
  document.getElementById("score2").textContent = "0";

  document.getElementById("goalMessage").textContent =
    "⚽ NEW MATCH!";

}

function changeFlag(team) {

  document.getElementById(
    "flagDisplay" + team
  ).textContent =
    document.getElementById(
      "flag" + team
    ).value;

}

function changeColour(team) {

  document.getElementById(
    "goal" + team
  ).style.background =
    document.getElementById(
      "colour" + team
    ).value;

}

function toggleSound() {

  soundOn = !soundOn;

  document.getElementById("goalMessage").textContent =
    soundOn
      ? "🔊 SOUND ON"
      : "🔇 SOUND OFF";

}

changeColour(1);
changeColour(2);

</script>

</body>
</html>
