<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backyard Kickoff</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: white;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.hero {
  min-height: 52vh;
  position: relative;
  background:
    linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.18)),
    url("609DF914-C4E1-4512-9C0F-3E452062484D.png");
  background-size: cover;
  background-position: center 68%;
}

.hero-title {
  position: absolute;
  top: 20px;
  left: 0;
  right: 0;
  text-align: center;
  text-shadow: 0 3px 12px #000;
}

.hero-title h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 900;
}

.hero-title p {
  margin: 5px 0 0;
  font-weight: bold;
  font-size: 15px;
}

.goal-message {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 16px;
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  text-shadow: 0 3px 10px black;
  min-height: 36px;
}

.game-panel {
  background: #111820;
  padding: 14px;
  border-radius: 24px 24px 0 0;
  margin-top: -6px;
}

.team {
  background: #1a222c;
  border: 1px solid #33404d;
  border-radius: 18px;
  padding: 11px;
  margin-bottom: 10px;
}

.team-top {
  display: grid;
  grid-template-columns: 1fr 90px 50px;
  gap: 7px;
}

.team-name {
  width: 100%;
  min-width: 0;
  border: 0;
  border-radius: 11px;
  padding: 11px 8px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.flag-select {
  border: 0;
  border-radius: 11px;
  padding: 8px 4px;
  font-size: 16px;
}

.colour-picker {
  width: 50px;
  height: 42px;
  border: 0;
  border-radius: 11px;
  padding: 3px;
}

.team-bottom {
  display: grid;
  grid-template-columns: 65px 1fr 125px;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.flag {
  font-size: 38px;
  text-align: center;
}

.score {
  font-size: 62px;
  line-height: 1;
  text-align: center;
  font-weight: 900;
}

.goal-btn {
  min-height: 66px;
  border: 0;
  border-radius: 16px;
  color: white;
  font-size: 17px;
  font-weight: 900;
}

.goal-btn:active {
  transform: scale(.96);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 7px;
  margin-top: 4px;
}

.control-btn {
  border: 1px solid #445160;
  border-radius: 13px;
  padding: 11px 4px;
  background: #1a222c;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.credit {
  text-align: center;
  font-size: 13px;
  opacity: .75;
  margin-top: 10px;
}

@media (max-width: 390px) {
  .hero {
    min-height: 50vh;
    background-position: center 70%;
  }

  .hero-title h1 {
    font-size: 30px;
  }

  .team-bottom {
    grid-template-columns: 55px 1fr 110px;
  }

  .score {
    font-size: 56px;
  }

  .goal-btn {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <div class="hero-title">
      <h1>⚽ Backyard Kickoff</h1>
      <p>Pick your teams. Start the match!</p>
    </div>

    <div id="goalMessage" class="goal-message"></div>

  </section>

  <section class="game-panel">

    <div class="team">

      <div class="team-top">

        <input id="name1" class="team-name" value="Arlo United">

        <select id="flag1" class="flag-select" onchange="changeFlag(1)">
          <option value="🇦🇺">🇦🇺 AUS</option>
          <option value="🇦🇷">🇦🇷 ARG</option>
          <option value="🇧🇷">🇧🇷 BRA</option>
          <option value="🇫🇷">🇫🇷 FRA</option>
          <option value="🇩🇪">🇩🇪 GER</option>
          <option value="🇮🇹">🇮🇹 ITA</option>
          <option value="🇵🇹">🇵🇹 POR</option>
          <option value="🇪🇸">🇪🇸 ESP</option>
          <option value="🏴">🏴 ENG</option>
          <option value="🇳🇱">🇳🇱 NED</option>
        </select>

        <input
          id="colour1"
          class="colour-picker"
          type="color"
          value="#e11d48"
          onchange="changeColour(1)"
        >

      </div>

      <div class="team-bottom">

        <div id="flagDisplay1" class="flag">🇦🇺</div>
        <div id="score1" class="score">0</div>

        <button id="goal1" class="goal-btn" onclick="goal(1)">
          ⚽ GOAL!
        </button>

      </div>

    </div>


    <div class="team">

      <div class="team-top">

        <input id="name2" class="team-name" value="Dad FC">

        <select id="flag2" class="flag-select" onchange="changeFlag(2)">
          <option value="🇦🇺">🇦🇺 AUS</option>
          <option value="🇦🇷">🇦🇷 ARG</option>
          <option value="🇧🇷">🇧🇷 BRA</option>
          <option value="🇫🇷">🇫🇷 FRA</option>
          <option value="🇩🇪">🇩🇪 GER</option>
          <option value="🇮🇹">🇮🇹 ITA</option>
          <option value="🇵🇹">🇵🇹 POR</option>
          <option value="🇪🇸">🇪🇸 ESP</option>
          <option value="🏴">🏴 ENG</option>
          <option value="🇳🇱">🇳🇱 NED</option>
        </select>

        <input
          id="colour2"
          class="colour-picker"
          type="color"
          value="#2563eb"
          onchange="changeColour(2)"
        >

      </div>

      <div class="team-bottom">

        <div id="flagDisplay2" class="flag">🇦🇺</div>
        <div id="score2" class="score">0</div>

        <button id="goal2" class="goal-btn" onclick="goal(2)">
          ⚽ GOAL!
        </button>

      </div>

    </div>


    <div class="controls">

      <button class="control-btn" onclick="undoGoal()">
        ↩ Undo
      </button>

      <button class="control-btn" onclick="resetGame()">
        🔄 New Game
      </button>

      <button class="control-btn" onclick="toggleSound()">
        🔊 Sound
      </button>

    </div>

    <div class="credit">
      Created by Arlo ⚽
    </div>

  </section>

</div>


<script>

let scores = [0, 0];
let lastTeam = null;
let soundOn = true;
let audioContext = null;

function goal(team) {

  const index = team - 1;

  scores[index]++;

  document.getElementById("score" + team).textContent =
    scores[index];

  lastTeam = team;

  const name =
    document.getElementById("name" + team).value ||
    "Team " + team;

  document.getElementById("goalMessage").textContent =
    "⚽ GOOOOOOAL! " + name + "!";

  if (soundOn) {
    playGoalCelebration();
  }

  setTimeout(() => {
    document.getElementById("goalMessage").textContent = "";
  }, 2200);
}


function undoGoal() {

  if (lastTeam && scores[lastTeam - 1] > 0) {

    scores[lastTeam - 1]--;

    document.getElementById(
      "score" + lastTeam
    ).textContent =
      scores[lastTeam - 1];

  }

}


function resetGame() {

  scores = [0, 0];
  lastTeam = null;

  document.getElementById("score1").textContent = "0";
  document.getElementById("score2").textContent = "0";

  document.getElementById("goalMessage").textContent =
    "⚽ NEW MATCH!";

}


function changeFlag(team) {

  document.getElementById(
    "flagDisplay" + team
  ).textContent =
    document.getElementById(
      "flag" + team
    ).value;

}


function changeColour(team) {

  document.getElementById(
    "goal" + team
  ).style.background =
    document.getElementById(
      "colour" + team
    ).value;

}


function toggleSound() {

  soundOn = !soundOn;

  document.getElementById("goalMessage").textContent =
    soundOn
      ? "🔊 SOUND ON"
      : "🔇 SOUND OFF";

}


function playGoalCelebration() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!audioContext) {
      audioContext = new AudioContext();
    }

    const ctx = audioContext;

    if (ctx.state === "suspended") {
      ctx.resume();
    }

    const now = ctx.currentTime;


    // REFEREE WHISTLE
    const whistle = ctx.createOscillator();
    const whistleGain = ctx.createGain();

    whistle.type = "sine";

    whistle.frequency.setValueAtTime(2100, now);
    whistle.frequency.linearRampToValueAtTime(2600, now + 0.25);
    whistle.frequency.linearRampToValueAtTime(2200, now + 0.5);

    whistleGain.gain.setValueAtTime(0.001, now);
    whistleGain.gain.linearRampToValueAtTime(0.18, now + 0.03);
    whistleGain.gain.linearRampToValueAtTime(0.001, now + 0.55);

    whistle.connect(whistleGain);
    whistleGain.connect(ctx.destination);

    whistle.start(now);
    whistle.stop(now + 0.6);


    // CROWD ROAR
    const duration = 2.4;

    const buffer =
      ctx.createBuffer(
        1,
        ctx.sampleRate * duration,
        ctx.sampleRate
      );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {

      const progress = i / data.length;

      const rise = Math.min(progress * 7, 1);

      const fade =
        progress > 0.72
          ? (1 - progress) / 0.28
          : 1;

      data[i] =
        (Math.random() * 2 - 1) *
        rise *
        fade;

    }

    const crowd = ctx.createBufferSource();
    crowd.buffer = buffer;

    const crowdFilter = ctx.createBiquadFilter();

    crowdFilter.type = "bandpass";
    crowdFilter.frequency.value = 750;
    crowdFilter.Q.value = 0.7;

    const crowdGain = ctx.createGain();

    crowdGain.gain.setValueAtTime(0.01, now + 0.18);
    crowdGain.gain.linearRampToValueAtTime(0.36, now + 0.7);
    crowdGain.gain.setValueAtTime(0.36, now + 1.4);
    crowdGain.gain.linearRampToValueAtTime(0.01, now + 2.55);

    crowd.connect(crowdFilter);
    crowdFilter.connect(crowdGain);
    crowdGain.connect(ctx.destination);

    crowd.start(now + 0.18);


    // STADIUM HORN
    const horn = ctx.createOscillator();
    const hornGain = ctx.createGain();

    horn.type = "sawtooth";

    horn.frequency.setValueAtTime(220, now + 0.55);
    horn.frequency.linearRampToValueAtTime(330, now + 0.9);
    horn.frequency.linearRampToValueAtTime(260, now + 1.35);

    hornGain.gain.setValueAtTime(0.001, now + 0.5);
    hornGain.gain.linearRampToValueAtTime(0.10, now + 0.62);
    hornGain.gain.linearRampToValueAtTime(0.001, now + 1.45);

    horn.connect(hornGain);
    hornGain.connect(ctx.destination);

    horn.start(now + 0.5);
    horn.stop(now + 1.5);


    // CELEBRATION CHIME
    const notes = [523, 659, 784, 1046];

    notes.forEach((frequency, i) => {

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      oscillator.type = "square";
      oscillator.frequency.value = frequency;

      const start =
        now + 0.8 + (i * 0.11);

      gain.gain.setValueAtTime(0.08, start);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        start + 0.25
      );

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start(start);
      oscillator.stop(start + 0.25);

    });

  } catch (e) {}

}


changeColour(1);
changeColour(2);

</script>

</body>
</html>
