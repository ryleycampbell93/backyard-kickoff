<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backyard Kickoff</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background:
    linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.72)),
    url("609DF914-C4E1-4512-9C0F-3E452062484D.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.app {
  min-height: 100vh;
  padding: 25px 14px 40px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

h1 {
  font-size: 38px;
  margin: 0;
  text-shadow: 0 3px 10px black;
}

.subtitle {
  margin: 5px 0 18px;
  font-weight: bold;
  text-shadow: 0 2px 6px black;
}

.scoreboard {
  display: flex;
  gap: 10px;
}

.team {
  flex: 1;
  padding: 14px 9px;
  border-radius: 22px;
  background: rgba(0,0,0,.68);
  backdrop-filter: blur(6px);
  border: 2px solid rgba(255,255,255,.35);
}

.team-name {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 10px 5px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.options {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

select, input[type="color"] {
  flex: 1;
  min-width: 0;
  height: 40px;
  border: none;
  border-radius: 9px;
  font-size: 18px;
}

.flag {
  font-size: 35px;
  margin-top: 8px;
}

.score {
  font-size: 72px;
  line-height: 1;
  font-weight: 900;
  margin: 8px 0 12px;
  text-shadow: 0 3px 8px black;
}

.goal {
  width: 100%;
  padding: 15px 4px;
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 17px;
  font-weight: 900;
  background: #16a34a;
}

.goal:active {
  transform: scale(.95);
}

.controls {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  justify-content: center;
}

.control {
  padding: 12px 16px;
  border: 2px solid white;
  border-radius: 14px;
  background: rgba(0,0,0,.65);
  color: white;
  font-weight: bold;
  font-size: 15px;
}

.goal-message {
  height: 42px;
  font-size: 30px;
  font-weight: 900;
  margin: 10px 0 4px;
  text-shadow: 0 3px 8px black;
}

.credit {
  margin-top: 10px;
  font-size: 13px;
  opacity: .9;
}
</style>
</head>

<body>

<div class="app">

  <h1>⚽ Backyard Kickoff</h1>
  <div class="subtitle">Pick your teams. Start the match!</div>

  <div id="goalMessage" class="goal-message"></div>

  <div class="scoreboard">

    <div class="team">
      <input class="team-name" id="name1" value="Arlo United">

      <div class="options">
        <select id="flag1" onchange="changeFlag(1)">
          <option value="🇦🇺">🇦🇺 Australia</option>
          <option value="🇦🇷">🇦🇷 Argentina</option>
          <option value="🇧🇷">🇧🇷 Brazil</option>
          <option value="🇫🇷">🇫🇷 France</option>
          <option value="🇩🇪">🇩🇪 Germany</option>
          <option value="🇮🇹">🇮🇹 Italy</option>
          <option value="🇵🇹">🇵🇹 Portugal</option>
          <option value="🇪🇸">🇪🇸 Spain</option>
          <option value="🏴">🏴 England</option>
          <option value="🇳🇱">🇳🇱 Netherlands</option>
        </select>

        <input type="color" id="colour1" value="#e11d48"
          onchange="changeColour(1)">
      </div>

      <div id="flagDisplay1" class="flag">🇦🇺</div>
      <div id="score1" class="score">0</div>

      <button id="goal1" class="goal" onclick="goal(1)">
        ⚽ GOAL!
      </button>
    </div>


    <div class="team">
      <input class="team-name" id="name2" value="Dad FC">

      <div class="options">
        <select id="flag2" onchange="changeFlag(2)">
          <option value="🇦🇺">🇦🇺 Australia</option>
          <option value="🇦🇷">🇦🇷 Argentina</option>
          <option value="🇧🇷">🇧🇷 Brazil</option>
          <option value="🇫🇷">🇫🇷 France</option>
          <option value="🇩🇪">🇩🇪 Germany</option>
          <option value="🇮🇹">🇮🇹 Italy</option>
          <option value="🇵🇹">🇵🇹 Portugal</option>
          <option value="🇪🇸">🇪🇸 Spain</option>
          <option value="🏴">🏴 England</option>
          <option value="🇳🇱">🇳🇱 Netherlands</option>
        </select>

        <input type="color" id="colour2" value="#2563eb"
          onchange="changeColour(2)">
      </div>

      <div id="flagDisplay2" class="flag">🇦🇺</div>
      <div id="score2" class="score">0</div>

      <button id="goal2" class="goal" onclick="goal(2)">
        ⚽ GOAL!
      </button>
    </div>

  </div>

  <div class="controls">
    <button class="control" onclick="undoGoal()">↩ Undo</button>
    <button class="control" onclick="resetGame()">🔄 New Game</button>
    <button class="control" onclick="toggleSound()">🔊 Sound</button>
  </div>

  <div class="credit">Created by Arlo ⚽</div>

</div>

<script>
let scores = [0, 0];
let lastTeam = null;
let soundOn = true;

function goal(team) {
  const index = team - 1;
  scores[index]++;

  document.getElementById("score" + team).textContent = scores[index];
  lastTeam = team;

  const name = document.getElementById("name" + team).value || "Team " + team;

  document.getElementById("goalMessage").textContent =
    "⚽ GOOOOAL! " + name + "!";

  if (soundOn) playGoalSound();

  setTimeout(() => {
    document.getElementById("goalMessage").textContent = "";
  }, 1800);
}

function undoGoal() {
  if (lastTeam && scores[lastTeam - 1] > 0) {
    scores[lastTeam - 1]--;
    document.getElementById("score" + lastTeam).textContent =
      scores[lastTeam - 1];
  }
}

function resetGame() {
  scores = [0, 0];
  lastTeam = null;

  document.getElementById("score1").textContent = "0";
  document.getElementById("score2").textContent = "0";
  document.getElementById("goalMessage").textContent = "⚽ NEW MATCH!";
}

function changeFlag(team) {
  document.getElementById("flagDisplay" + team).textContent =
    document.getElementById("flag" + team).value;
}

function changeColour(team) {
  document.getElementById("goal" + team).style.background =
    document.getElementById("colour" + team).value;
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("goalMessage").textContent =
    soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
}

function playGoalSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    const notes = [392, 523, 659, 784];

    notes.forEach((frequency, i) => {
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.frequency.value = frequency;
      oscillator.type = "square";

      const start = ctx.currentTime + i * 0.12;

      gain.gain.setValueAtTime(0.12, start);
      gain.gain.exponentialRampToValueAtTime(0.01, start + 0.22);

      oscillator.start(start);
      oscillator.stop(start + 0.22);
    });
  } catch (e) {}
}

changeColour(1);
changeColour(2);
</script>

</body>
</html>
