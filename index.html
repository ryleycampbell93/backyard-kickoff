<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Kickoff</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(#15803d, #052e16);
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      padding: 25px;
    }

    .ball {
      font-size: 70px;
    }

    h1 {
      font-size: 38px;
      margin: 10px 0 5px;
    }

    .created {
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .team {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 20px 10px;
    }

    .team input {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    .score {
      font-size: 70px;
      font-weight: bold;
      margin: 15px 0;
    }

    .goal {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px 5px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset {
      margin-top: 25px;
      border: 2px solid white;
      background: transparent;
      color: white;
      border-radius: 15px;
      padding: 13px 25px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="ball">⚽️</div>

    <h1>Backyard Kickoff</h1>

    <div class="created">Created by Arlo</div>

    <div class="scoreboard">

      <div class="team">
        <input value="Team 1">
        <div class="score" id="score1">0</div>
        <button class="goal" onclick="goal(1)">⚽ ADD GOAL</button>
      </div>

      <div class="team">
        <input value="Team 2">
        <div class="score" id="score2">0</div>
        <button class="goal" onclick="goal(2)">⚽ ADD GOAL</button>
      </div>

    </div>

    <button class="reset" onclick="resetGame()">New Game</button>

  </main>

  <script>
    let team1 = 0;
    let team2 = 0;

    function goal(team) {
      if (team === 1) {
        team1++;
        document.getElementById("score1").textContent = team1;
      } else {
        team2++;
        document.getElementById("score2").textContent = team2;
      }
    }

    function resetGame() {
      team1 = 0;
      team2 = 0;

      document.getElementById("score1").textContent = 0;
      document.getElementById("score2").textContent = 0;
    }
  </script>

</body>
</html>
